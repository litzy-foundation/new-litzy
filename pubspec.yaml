name: litzy
publish_to: none
environment:
  sdk: ^3.14.0

workspace:
  - packages/core
  - packages/protocol
  - packages/engine
  - packages/security
  - packages/l10n
  - packages/cli
  - packages/app

dev_dependencies:
  lints: ^6.1.0
  melos: ^8.10.1
  test: ">=1.32.0 <1.33.0"

melos:
  command:
    run:
      noSelect: true
  scripts:
    analyze:
      description: Analyze every package.
      steps:
        - analyze:dart
        - analyze:flutter
    analyze:dart:
      description: Analyze the Dart packages.
      exec: dart analyze
      packageFilters:
        scope:
          - core
          - protocol
          - engine
          - security
          - l10n
          - cli
    analyze:flutter:
      description: Analyze the Flutter client package.
      exec: flutter analyze
      packageFilters:
        scope:
          - app
    format:
      description: Format every package.
      exec: dart format .
    test:
      description: Run the Dart packages and the Flutter client tests.
      steps:
        - test:dart
        - test:flutter
    test:dart:
      description: Run tests that use the Dart test runner.
      exec: dart test
      packageFilters:
        scope:
          - core
          - protocol
          - engine
          - security
          - l10n
          - cli
    test:flutter:
      description: Run the Flutter widget tests of the GUI package.
      exec: flutter test
      packageFilters:
        scope:
          - app
    test:core:
      description: Run the core package tests.
      exec: dart test
      packageFilters:
        scope:
          - core
    test:protocol:
      description: Run the protocol package tests.
      exec: dart test
      packageFilters:
        scope:
          - protocol
    test:engine:
      description: Run the engine package tests.
      exec: dart test
      packageFilters:
        scope:
          - engine
    test:cli:
      description: Run the CLI package tests.
      exec: dart test
      packageFilters:
        scope:
          - cli
    test:security:
      description: Run the security package tests.
      exec: dart test
      packageFilters:
        scope:
          - security
    test:l10n:
      description: Run the localisation package tests.
      exec: dart test
      packageFilters:
        scope:
          - l10n
    test:app:
      description: Run the Flutter client widget tests.
      exec: flutter test
      packageFilters:
        scope:
          - app
