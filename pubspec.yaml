name: litzy
publish_to: none
environment:
  sdk: ^3.14.1

workspace:
  - packages/core
  - packages/protocol
  - packages/engine

dev_dependencies:
  lints: ^6.1.0
  melos: ^8.10.1
  test: ^1.33.0

melos:
  scripts:
    analyze:
      exec: dart analyze
    format:
      exec: dart format .
    test:
      exec: dart test
    test:core:
      exec: dart test
      packageFilters:
        scope:
          - core
    test:protocol:
      exec: dart test
      packageFilters:
        scope:
          - protocol
    test:engine:
      exec: dart test
      packageFilters:
        scope:
          - engine
